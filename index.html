<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Calculateur de Lentille Interactive</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<div><h1>Calculateur de Lentille Interactive</h1></div>
<div class="main-layout">

    <div id="formSection">
  
      <label for="lensType">Type de lentille :</label>
      <select id="lensType">
        <option value="convergente">Convergente (f > 0)</option>
        <option value="divergente">Divergente (f < 0)</option>
      </select>
  
      <label for="focal">Focale f (cm) :</label>
      <input id="focal" type="number" placeholder="30" value="">
  
      <label for="do">Distance objet d₀ (cm) :</label>
      <input id="do" type="number" placeholder="10" value="">
  
      <label for="ho">Hauteur objet h₀ (cm) :</label>
      <input id="ho" type="number" placeholder="5" value="">
  
      <label for="tickInterval">Intervalle entre les ticks (cm) :</label>
      <input id="tickInterval" type="range" min="1" max="10" value="1">
      <span id="tickIntervalValue">1</span>
  
      <div id="results"></div>
    </div>
  
    <div id="canvasContainer">
      <canvas id="rayCanvas" width="1600" height="800"></canvas>
      <div id="controls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">-</button>
      </div>
      <div id="legend">
        <span style="color: blue;">● Objet</span><br>
        <span style="color: red;">● Image</span>
      </div>
      <button id="exportBtn">📤 Exporter</button>
    </div>
  </div>
  
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</html>
